name: Deactivate Programs

on:
  workflow_dispatch: {}

jobs:
  deactivate-programs:
    runs-on: ubuntu-latest
    steps:
      - name: Deactivate Programs Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEACTIVATE_PROGRAMS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DEACTIVATE_PROGRAMS_WEBHOOK_URL not set in repo secrets" >&2
            exit 1
          fi
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_SECRET not set in repo secrets" >&2
            exit 1
          fi

          echo "Calling deactivate programs webhook..."
          response=$(curl -sS -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')

          # Extract HTTP status code and response body
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Programs deactivation webhook called successfully"
          else
            echo "❌ Programs deactivation webhook failed with status $http_code"
            exit 1
          fi
